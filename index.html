<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrapper">

    <div class="content">
        <h1>Generate a <br/><span>random password</span></h1>
        <p>Never use an insecure password again!</p>
        <button id="generate">Generate Passwords</button>
    
        <div class="container">

            <div class="option">
                <div class="toggle password">
                    Numbers
                    <label class="switch">
                    <input type="checkbox" id="toggle">
                    <span class="slider"></span>
                    </label>
                </div>
                <div id="password1" class="password">
                    123456
                </div>
            </div>
       
            <div class="option">
                <div class="toggle password">
                    Symbols
                    <label class="switch">
                    <input type="checkbox" id="toggle">
                    <span class="slider"></span>
                    </label>
                </div>
                <div id="password2" class="password">
                        12346
                </div>   
            </div>
    </div>
    </div>
</div>
</body>
<script src="index.js"></script>
</html>
